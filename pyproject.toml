[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "tabdistances"
version = "0.1.0"
description = "Measure distances between sets of tabular datasets"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn>=1.2",
    "pandas",
    "numpy",
    "scipy",
    "pyarrow",
    "torch>=2.2",
    "einops",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tabdistances*"]
